<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<meta name="description" content="Nudge Nudge — a companion that remembers your tasks, reminds you on time and keeps you focused.">
<title>Nudge Nudge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101216;--s1:#1A1C22;--s2:#22252C;--line:#2C3038;--t1:#EEF0F2;--t2:#C7CBD1;--t3:#9AA0A8;
  --mint:#8BE9C6;--amber:#FFB547;--peri:#9DB4FF;--rose:#FF9A8F;--accent:#8BE9C6;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--disp:"Space Grotesk",Inter,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.top .when{font-size:13px;color:var(--t3)}
.top h1{margin:2px 0 0;font-family:var(--disp);font-weight:600;font-size:25px;letter-spacing:-.02em}
@media (max-width:430px){.top .vt{display:none}.top .pill{width:44px;justify-content:center;padding:0}.top h1{font-size:23px}}
.pill svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:500;color:var(--t2)}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--t3)}
.iconbtn:hover{background:var(--s2);color:var(--t1)}
main{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 0 calc(150px + env(safe-area-inset-bottom,0px))}
.card{background:var(--s1);border-radius:24px}
.h2{font-family:var(--disp);font-weight:600;font-size:22px;margin:4px 0 0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--t3);margin:0}
.label{font-size:12px;font-weight:600;color:var(--t3)}
/* face */
.compan{padding:12px 18px 14px;display:flex;flex-direction:column;gap:10px}
.facebtn{align-self:center;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center}
.face{display:flex}
.look{display:flex;gap:24px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.eyew{position:relative;width:104px;height:124px}
@property --lt{syntax:'<length>';inherits:false;initial-value:0px}
@property --lb{syntax:'<length>';inherits:false;initial-value:0px}
@property --la{syntax:'<angle>';inherits:false;initial-value:0deg}
.eyein{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:blink 5.2s infinite;transform-origin:center;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--ec,var(--accent)) 55%,transparent))}
.eyeb{display:block;--lb:0px;-webkit-mask-image:radial-gradient(62% 64px at 50% calc(100% + 64px - var(--lb)),transparent 97%,#000 100%);mask-image:radial-gradient(62% 64px at 50% calc(100% + 64px - var(--lb)),transparent 97%,#000 100%);
  transition:width .45s cubic-bezier(.34,1.4,.5,1),height .45s cubic-bezier(.34,1.4,.5,1),transform .45s cubic-bezier(.34,1.4,.5,1),opacity .3s,--lb .42s cubic-bezier(.2,.8,.2,1)}
.look{position:relative}
.eye{display:block;position:relative;width:100%;height:100%;background:radial-gradient(120% 90% at 32% 22%,color-mix(in srgb,var(--ec,var(--accent)) 62%,#fff) 0,var(--ec,var(--accent)) 46%,color-mix(in srgb,var(--ec,var(--accent)) 82%,#000) 100%);--lt:0px;--la:0deg;-webkit-mask-image:linear-gradient(calc(180deg + var(--la)),transparent var(--lt),#000 calc(var(--lt) + .6px));mask-image:linear-gradient(calc(180deg + var(--la)),transparent var(--lt),#000 calc(var(--lt) + .6px));
  transition:border-radius .45s,background .3s,--lt .42s cubic-bezier(.2,.8,.2,1),--la .42s cubic-bezier(.2,.8,.2,1)}
.lid{display:none!important}
.eye::after{content:"";position:absolute;left:18%;top:13%;width:24%;height:15%;border-radius:50%;background:rgba(255,255,255,.62);transition:opacity .3s}
.face[data-expr="sleepy"] .eye::after,.face[data-expr="bored"] .eye::after,.face[data-expr="focused"] .eye::after,.face[data-expr="laugh"] .eye::after{opacity:0}
.acc{position:absolute;left:0;width:232px;pointer-events:none;z-index:3}
.acc svg{display:block;width:232px;overflow:visible}
.acc-hat{top:-60px;height:70px}.acc-glasses{top:0;height:124px}.acc-neck{top:112px;height:56px}
.face.has-hat{padding-top:54px}.face.has-neck{padding-bottom:40px}
.heart path{fill:var(--ec,var(--accent))}
.shake{animation:shake .5s ease-in-out infinite}
.tilt .look{transform:rotate(-8deg)}
@keyframes shake{0%,100%{transform:translateY(0)}25%{transform:translateY(-6px) rotate(-2deg)}75%{transform:translateY(-2px) rotate(2deg)}}
.heart{position:absolute;left:15px;top:22px;transition:all .45s cubic-bezier(.3,1.6,.5,1)}
.lid{position:absolute;left:-16px;right:-16px;background:var(--lidc,var(--s1));transition:all .45s cubic-bezier(.2,.8,.2,1)}
.lid.t{top:0;transform-origin:50% 100%}
.lid.b{bottom:0;border-radius:50% 50% 0 0/34px 34px 0 0}
.float{animation:float 5s ease-in-out infinite}
.talk{animation:talk .32s ease-in-out infinite}
.bounce{animation:bounce 1.1s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.06)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes talk{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}60%{transform:translateY(0)}75%{transform:translateY(-4px)}}
.say{margin:0;min-height:66px;font-size:15px;line-height:1.45}
.caret{display:inline-block;width:2px;height:16px;margin-left:2px;vertical-align:-3px;background:var(--accent);animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.sayrow{display:flex;align-items:center;gap:8px;min-height:40px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--accent);color:#0F1013;font-weight:600;font-size:13.5px;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--t1)}
.btn.big{height:52px;font-size:15px;padding:0 22px}
.btn.danger{background:transparent;border:1px solid #4a2f2c;color:var(--rose)}
.dots{display:flex;margin-left:auto}
.dots button{width:20px;height:40px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.dots span{display:block;height:6px;width:6px;border-radius:3px;background:#3A3F48;transition:all .3s}
.dots button[aria-pressed="true"] span{width:18px;background:var(--accent)}
/* rings */
.rings{display:flex;align-items:center;gap:18px;padding:14px 18px;text-decoration:none;color:inherit}
.rings svg{flex-shrink:0;transform:rotate(-90deg)}
.rings svg circle.v{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.rl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1}
.rl b{display:block;font-size:12px}
.rl span{display:block;font-size:15px;font-weight:500;margin-top:2px}
.rl small{font-size:11px;color:var(--t3)}
/* list */
.sect{display:flex;justify-content:space-between;align-items:center;min-height:24px;margin-top:4px}
.row{display:flex;align-items:center;gap:6px;min-height:58px;padding:4px 4px 4px 2px;border-radius:18px;background:var(--s1)}
.row .chk{flex-shrink:0;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.row .chk i{width:24px;height:24px;border-radius:50%;border:2px solid #4A4F59;display:flex;align-items:center;justify-content:center;transition:all .2s}
.row.done .chk i{background:var(--accent);border-color:var(--accent)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border:0;background:transparent;text-align:left;padding:6px 0}
.row .tt{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .tt{color:var(--t3);text-decoration:line-through}
.row .mt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.row .mt .k{width:7px;height:7px;border-radius:50%}
.row .mt .od{color:var(--rose);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:500;color:var(--t2)}
.chip[aria-pressed="true"]{background:var(--t1);border-color:var(--t1);color:#0F1013}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;border:1px dashed var(--line);border-radius:20px;color:var(--t3);font-size:14px;text-align:center}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:10px 0 env(safe-area-inset-bottom,0px)}
.dock-in{max-width:520px;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;gap:8px}
.qa{display:flex;gap:10px;align-items:center}
.qa label{flex:1;display:flex;align-items:center;height:52px;padding:0 18px;border-radius:999px;background:var(--s1);border:1px solid var(--line)}
.qa input{flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0}
.qa input::placeholder{color:#8A8F98}
.qa .go{flex-shrink:0;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#0F1013}
.qa .go.rec{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 25%,transparent)}}
.hint{font-size:12px;color:var(--t3);padding:0 18px;min-height:16px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:56px}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--t3)}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,6,8,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--s1);border-radius:28px 28px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1);--lidc:var(--s1)}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:#3A3F48;margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input,.field textarea,.field select{height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:15px;outline:0}
.field textarea{height:72px;padding:12px 14px;resize:vertical}
.seg{display:grid;gap:4px;padding:4px;border-radius:14px;background:var(--bg)}
.seg button{height:36px;border:0;border-radius:10px;background:transparent;font-size:12.5px;font-weight:500;color:var(--t2);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--t1);color:#0F1013}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field input,.field select,.field textarea{width:100%;min-width:0}
.sw{position:relative;flex-shrink:0;width:46px;height:28px;border:0;border-radius:999px;background:#3A3F48;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s cubic-bezier(.2,.8,.2,1)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:21px}
.list{display:flex;flex-direction:column;background:var(--bg);border-radius:18px;padding:0 14px}
.li{display:flex;align-items:center;gap:10px;min-height:54px;border-bottom:1px solid #22252C}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .grow span:first-child{font-size:14.5px}
.li .grow span+span{font-size:12px;color:var(--t3)}
.card .list{background:transparent}
.li input[type=time]{width:124px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font-size:14px}
.days{display:flex;gap:4px}
.days button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:11px;font-weight:600;color:var(--t3);padding:0}
.days button[aria-pressed="true"]{background:var(--t1);color:#0F1013;border-color:var(--t1)}
/* alert */
.alert{position:fixed;inset:0;z-index:60;background:#121519;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;--lidc:#121519;animation:fade .25s ease}
.alert .time{font-family:var(--disp);font-size:64px;font-weight:600;letter-spacing:-.03em;margin:0}
.alert .what{font-size:20px;font-weight:600;margin:0;max-width:440px}
.alert .meta{font-size:14px;color:var(--t3);margin:0}
.alert .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin-top:8px}
.toast{position:fixed;left:50%;justify-content:space-between;width:min(440px,calc(100% - 36px));bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:14px;max-width:min(480px,calc(100% - 36px));padding:10px 10px 10px 16px;border-radius:14px;background:var(--t1);color:#0F1013;font-size:14px;font-weight:500;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.toast button{height:34px;padding:0 12px;border:0;border-radius:10px;background:#0F1013;color:var(--t1);font-weight:600;font-size:13px}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--s1);border:1px solid var(--line);font-size:13.5px;color:var(--t2)}
.banner p{margin:0;flex:1;line-height:1.4}
/* ask */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px 20px 20px 6px;background:var(--s1);font-size:15px;line-height:1.45;white-space:pre-line}
.msg.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:var(--t1);color:#0F1013}
.msg small{display:block;margin-top:6px;font-size:12px;color:var(--t3)}
/* focus */
.fring{position:relative;width:min(300px,78vw);aspect-ratio:1;align-self:center;margin:4px 0}
.fring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.fring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.fring .clock{font-family:var(--disp);font-size:clamp(40px,12vw,54px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mini .face{transform:scale(.42);transform-origin:center}
.side{display:none}
.tgrid{display:flex;flex-direction:column;gap:12px}
.tgrid>div{display:flex;flex-direction:column;gap:12px}
.narrow{display:flex;flex-direction:column;gap:12px}
@media (min-width:1000px){
  body{padding-left:248px}
  .side{display:flex;position:fixed;left:0;top:0;bottom:0;width:248px;flex-direction:column;gap:4px;padding:26px 14px 20px;border-right:1px solid var(--line);background:#0D0F12;z-index:25}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-family:var(--disp);font-weight:600;font-size:18px}
  .side .mk{display:inline-flex;gap:3px;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:#0B0D10;border:1px solid var(--line)}
  .side .mk i{display:block;width:6px;height:10px;border-radius:3px;background:var(--accent)}
  .side .nav{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:14px;border:0;background:transparent;color:var(--t2);font-size:15px;text-align:left}
  .side .nav:hover{background:var(--s1);color:var(--t1)}
  .side .nav[aria-current="page"]{background:var(--s1);color:var(--accent);font-weight:600}
  .side .grow{flex:1}
  #app{max-width:1180px;padding:28px 40px 0}
  .dock{left:248px}
  .dock .tabs{display:none}
  .dock-in{max-width:1180px;padding:0 40px}
  main{padding-bottom:120px}
  .tgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
  .narrow{max-width:780px}
  .toast{left:calc(50% + 124px)}
}

.row.hi{box-shadow:inset 3px 0 0 #FF8A80}
.matrix{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){.matrix{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.quad{min-width:0;background:var(--s1);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--q)}
.quad h3{margin:0 0 4px;display:flex;flex-direction:column;gap:2px;font-size:16px;color:var(--q)}
.quad h3 small{font-size:12px;color:var(--t3);font-weight:500}
.quad .row{background:var(--bg)}
.talkbtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px}
.compan{position:relative}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat div{background:var(--bg);border-radius:16px;padding:12px}
.stat b{display:block;font-family:var(--disp);font-size:20px;margin-top:2px}
.stat span{font-size:12px;color:var(--t3)}
.bar{height:8px;border-radius:5px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11px;color:var(--t3);text-align:center;padding:4px 0}
.cal button{position:relative;aspect-ratio:1/1;min-height:42px;border:0;border-radius:12px;background:var(--s1);color:var(--t2);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cal button.out{opacity:.35}.cal button.td{color:var(--accent);font-weight:700}.cal button[aria-pressed="true"]{background:var(--t1);color:#0F1013}
.cal .dots2{display:flex;gap:2px;height:6px}.cal .dots2 i{width:5px;height:5px;border-radius:50%}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc button{height:56px;border:0;border-radius:16px;background:var(--bg);font-size:20px;font-weight:500;color:var(--t1)}
.calc button.op{background:var(--s2);color:var(--accent)}.calc button.eq{background:var(--accent);color:#0F1013}
.calcd{background:var(--bg);border-radius:18px;padding:14px 16px;text-align:right;margin-bottom:10px;min-height:86px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.calcd .ex{font-size:15px;color:var(--t3);word-break:break-all}.calcd .rs{font-family:var(--disp);font-size:34px;font-weight:600;word-break:break-all}
.moreg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.moreg button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:0;border-radius:20px;background:var(--bg);color:var(--t1);font-size:15px;font-weight:600;text-align:left}
.moreg button span{font-size:12px;color:var(--t3);font-weight:400}
/* voice overlay */
.vo{position:fixed;inset:0;z-index:66;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(9,10,13,.6);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);animation:fade .25s ease;--lidc:transparent}
.vo .eyew{--lidc:#15171B}
.vo-face{background:#15171B;border-radius:40px;padding:14px 22px;transform:scale(.72)}
.vo canvas{width:min(560px,90vw);height:110px}
.vo-state{margin:0;font-size:14px;color:var(--t2);display:flex;align-items:center;gap:8px}
.vo-state i{width:8px;height:8px;border-radius:50%;background:var(--rose);animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.3}}
.vo textarea{width:min(560px,92vw);min-height:110px;max-height:34vh;padding:16px 18px;border-radius:20px;border:1px solid var(--line);background:rgba(26,28,34,.85);color:var(--t1);font-size:18px;line-height:1.45;resize:vertical;outline:0}
.vo textarea:focus{border-color:var(--accent)}
.vo-hint{margin:0;min-height:20px;font-size:13px;color:var(--accent)}
.vo-note{margin:0;max-width:480px;text-align:center;font-size:13px;color:var(--t3)}
.vo-acts{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;width:min(560px,92vw)}
/* ask motion */
.msg.in{animation:msgin .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes msgin{from{opacity:0;transform:translateY(12px) scale(.98)}}
.typing{display:inline-flex;gap:5px;padding:14px 16px;border-radius:20px 20px 20px 6px;background:var(--s1);align-self:flex-start}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--t3);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.askhead{display:flex;align-items:center;gap:14px}
.askface{width:104px;height:66px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--s1);--lidc:var(--s1);overflow:hidden}
.askface .asc{transform:scale(.36);flex-shrink:0}
.msg .act{margin-top:10px;animation:msgin .3s .1s both}
.chip{transition:transform .15s}.chip:active{transform:scale(.95)}
.btn{transition:transform .12s,background .2s}.btn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  const press = (k) => {
    if (k === 'C') calcEx = ''; else if (k === '⌫') calcEx = calcEx.slice(0, -1); else if (k === 'x²') calcEx += '²';
    else if (k === '±') { const m = calcEx.match(/(\d*\.?\d+)$/); if (m) { const st = calcEx.length - m[1].length; calcEx = calcEx.slice(0, st) + (calcEx[st - 1] === '−' && (st === 1 || /[÷×−+(]/.test(calcEx[st - 2])) ? '' : '−') + m[1]; if (calcEx.slice(0, st).endsWith('−−')) calcEx = calcEx.slice(0, st - 2) + m[1]; } }
    else if (k === '=') { try { const v = calcEval(calcEx); calcHist.push(calcEx + ' = ' + v); calcEx = String(v).replace('-', '−'); } catch (e) { rs.textContent = 'Check the sum'; return; } }
    else calcEx += k;

  };
  $('#calc').addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  const kh = (e) => { if (!$('#calc')) return document.removeEventListener('keydown', kh); const m = { '*': '×', '/': '÷', '-': '−', Enter: '=', Backspace: '⌫', Escape: null, Delete: 'C' }; let k = e.key in m ? m[e.key] : e.key; if (/^[\d.+%()]$/.test(k) || ['×', '÷', '−', '=', '⌫', 'C'].includes(k)) { e.preventDefault(); press(k); } };
  document.addEventListener('keydown', kh);
  $('#c-copy').addEventListener('click', () => { try { navigator.clipboard.writeText(rs.textContent.replace(/,/g, '')); toast('Copied'); } catch (e) {} });
  $('#c-use').addEventListener('click', () => { const v = rs.textContent.replace(/,/g, ''); layer(''); view = 'money'; render(); const a = $('#mon-amt'); if (a && +v) { a.value = Math.abs(+v); a.focus(); } });
  upd();
}
